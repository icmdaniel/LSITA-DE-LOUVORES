<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Louvores - ICM</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Times+New+Roman&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: #c8102e;
            --secondary: #27ae60;
            --info: #2980b9;
            --bg-color: #f4f7f6;
            --app-text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--app-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }

        /* --- ABAS (TABS) --- */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #ddd;
            color: #333;
            box-shadow: none;
            flex: 1;
            min-width: 150px;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Container de Pesquisa com Sugestões Personalizadas */
        .search-container {
            position: relative;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }

        .search-container input, .config-container input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            text-transform: uppercase;
        }

        .search-container input:focus, .config-container input:focus, #textarea-hinos, .textarea-hinos:focus {
            border-color: var(--primary);
        }

        .config-container {
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .config-container input {
            width: 100%;
        }

        #sugestoes-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 110px;
            background: white;
            border: 2px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sugestao-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 1px solid #eee;
        }

        .sugestao-item:hover {
            background-color: #f0f0f0;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .btn-add { background-color: var(--info); }
        .btn-salvar { background-color: var(--secondary); }
        .btn-limpar { background-color: #666; }
        .btn-nuvem { background-color: #8e44ad; width: 100%; margin-top: 10px; }

        /* Textarea de Hinos */
        #textarea-hinos, .textarea-hinos {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 14px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        
        #textarea-banco-cifras {
            height: 400px;
        }

        /* ÁREA QUE SERÁ TRANSFORMADA EM IMAGEM */
        .capture-wrapper {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            overflow-x: auto;
        }

        #lista-louvores {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            border: 2px solid #000;
            font-family: Arial, sans-serif;
            margin: 0 auto;
        }

        /* Cabeçalho ICM */
        .header-icm {
            padding: 15px 20px;
            border-bottom: 2px solid #000;
            text-align: center;
        }

        .logo-icm {
            color: #bd1622;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-icm .serif {
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 2px solid #000;
        }

        .sub-header .data-text { text-decoration: none; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid #000;
            padding: 12px 10px;
            font-size: 18px;
        }

        th { background-color: #e0e0e0; font-weight: bold; }
        th:first-child { width: 80px; text-align: center; }
        th:nth-child(2) { text-align: center; }
        td:first-child { text-align: center; }
        td:nth-child(2) { text-align: left; padding-left: 15px; }

        td[contenteditable="true"] {
            outline: none;
            cursor: text;
            text-transform: uppercase;
        }
        
        td[contenteditable="true"]:empty:before {
            content: "\feff";
            display: block;
        }

        td[contenteditable="true"]:hover {
            background-color: #f9f9f9;
        }
        
        /* Estilos da aba de Cifras */
        #container-cifras {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cifra-block {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-family: monospace; /* Fonte monoespaçada é CRÍTICA para alinhar cifras */
            font-size: 16px;
            white-space: pre-wrap; /* Mantém as quebras de linha do texto original */
            overflow-x: auto;
            color: #333;
        }

        .cifra-block strong {
            color: var(--primary);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 18px;
            display: block;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .sub-header { font-size: 18px; padding: 8px 12px; }
            th, td { padding: 10px 6px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <h1>Gerador de Lista de Louvores</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="alternarAba('gerador')">📋 Gerador</button>
        <button class="tab-btn" onclick="alternarAba('cifras')">🎸 Cifras da Lista</button>
        <button class="tab-btn" onclick="alternarAba('gerenciar')">☁️ Gerenciar Hinos</button>
        <button class="tab-btn" onclick="alternarAba('banco-cifras')">📄 Banco de Cifras</button>
    </div>

    <div id="tab-gerador" class="tab-content active">
        <div class="config-container">
            <input type="text" id="nome-igreja-input" placeholder="Nome da igreja / localidade (Opcional, ex: Centro)" autocomplete="off">
        </div>

        <div class="search-container">
            <input type="text" id="busca-hino" placeholder="Pesquisar número ou nome do louvor..." autocomplete="off">
            <div id="sugestoes-lista"></div>
            <button onclick="adicionarHino()" class="btn-add">➕ Adicionar</button>
        </div>
        <div class="controls">
            <button onclick="salvarImagem(event)" class="btn-salvar">💾 Salvar Imagem</button>
            <button onclick="exportarECompartilhar(event)">📲 Compartilhar</button>
            <button onclick="limparLista()" class="btn-limpar">🧹 Limpar</button>
        </div>

        <div class="capture-wrapper">
            <div id="lista-louvores">
                <div class="header-icm">
                    <div class="logo-icm">
                        <span class="serif">IGREJA CRISTÃ MARANATA<span id="sub-igreja-display"></span></span>
                    </div>
                </div>
                
                <div class="sub-header">
                    <span>LOUVORES</span>
                    <span><span id="data-atual" class="data-text"></span></span>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Nome do Hino</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                        <tr><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="tab-cifras" class="tab-content">
        <div class="controls">
            <button onclick="renderizarCifras()" class="btn-add">🔄 Atualizar Cifras</button>
        </div>
        <div id="container-cifras">
            <p style="text-align: center; color: #666;">As cifras dos louvores selecionados na lista aparecerão aqui.</p>
        </div>
    </div>

    <div id="tab-gerenciar" class="tab-content">
        <div style="width: 100%; margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px; text-align: left;">📚 Coletânea (um hino por linha):</label>
            <textarea id="textarea-coletanea" class="textarea-hinos" placeholder="Ex:\n1 - O sangue de Jesus\n2 - O sangue de Jesus tem poder para salvar"></textarea>
        </div>

        <div style="width: 100%; margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px; text-align: left;">👶 CIAS (um hino por linha):</label>
            <textarea id="textarea-cias" class="textarea-hinos" placeholder="Ex:\n1 - Jesus me ama\nOu apenas o nome do louvor"></textarea>
        </div>

        <div style="width: 100%; margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px; text-align: left;">🎵 Avulsos (um hino por linha):</label>
            <textarea id="textarea-avulsos" class="textarea-hinos" placeholder="Ex:\nEle é exaltado\nOu 1 - Nome do louvor"></textarea>
        </div>

        <button onclick="salvarHinosNuvem()" class="btn-nuvem">☁️ Salvar no Banco de Dados</button>
    </div>

    <div id="tab-banco-cifras" class="tab-content">
        <div style="width: 100%; margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px; text-align: left;">📄 Texto Bruto das Cifras (Cole o texto extraído do PDF aqui):</label>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px; text-align: left;">O sistema buscará as cifras digitadas neste campo. O texto deve conter o número do hino seguido de hífen para funcionar corretamente (Ex: "3 - CLAMO A TI").</p>
            <textarea id="textarea-banco-cifras" class="textarea-hinos" placeholder="Cole o texto do PDF aqui..."></textarea>
        </div>
        <button onclick="salvarBancoCifrasNuvem()" class="btn-nuvem">☁️ Salvar Cifras na Nuvem</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCEYvY23Arkkf16ozGJrQlYaiolvNPmvAc",
            authDomain: "lista-de-louvores.firebaseapp.com",
            projectId: "lista-de-louvores",
            storageBucket: "lista-de-louvores.firebasestorage.app",
            messagingSenderId: "90868918563",
            appId: "1:90868918563:web:dc0dbfe08622c060360496"
        };

        // Inicializar Firebase e Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variáveis Globais
        let salvandoRemotamente = false;
        let hinosArray = [];
        let textoBancoCifras = ""; // Armazena o texto bruto das cifras

        window.onload = function() {
            // Configurar Data
            const dataSpan = document.getElementById('data-atual');
            const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
            const hoje = new Date();
            const nomeDia = diasSemana[hoje.getDay()];
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            dataSpan.textContent = `${nomeDia.toUpperCase()} - ${dia}/${mes}/${ano}`;

            // Configurar Eventos do Input de Busca e Igreja
            const inputBusca = document.getElementById('busca-hino');
            inputBusca.addEventListener('input', atualizarSugestoes);

            const inputIgreja = document.getElementById('nome-igreja-input');
            const subIgrejaDisplay = document.getElementById('sub-igreja-display');
            
            inputIgreja.addEventListener('input', function() {
                const valor = inputIgreja.value.trim();
                if (valor) {
                    subIgrejaDisplay.textContent = ' - ' + valor;
                } else {
                    subIgrejaDisplay.textContent = '';
                }
                salvarNoFirestore();
            });

            // Salvar ao editar células diretamente
            const celulasEditaveis = document.querySelectorAll('td[contenteditable="true"]');
            celulasEditaveis.forEach(celula => {
                celula.addEventListener('input', salvarNoFirestore);
            });

            // OUVIR LISTA DE HINOS (DA NUVEM)
            onSnapshot(doc(db, "configuracoes", "listaHinos"), (docSnap) => {
                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    const coletanea = dados.coletanea || dados.hinos || [];
                    const cias = dados.cias || [];
                    const avulsos = dados.avulsos || [];

                    document.getElementById('textarea-coletanea').value = coletanea.join('\n');
                    document.getElementById('textarea-cias').value = cias.join('\n');
                    document.getElementById('textarea-avulsos').value = avulsos.join('\n');

                    processarHinosParaBusca(coletanea, cias, avulsos);
                }
            });

            // OUVIR BANCO DE CIFRAS (DA NUVEM)
            onSnapshot(doc(db, "configuracoes", "textosCifras"), (docSnap) => {
                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    textoBancoCifras = dados.conteudo || "";
                    document.getElementById('textarea-banco-cifras').value = textoBancoCifras;
                }
            });

            // OUVIR ALTERAÇÕES NA TABELA EM TEMPO REAL
            onSnapshot(doc(db, "configuracoes", "listaAtual"), (docSnap) => {
                if (docSnap.exists() && !salvandoRemotamente) {
                    const dados = docSnap.data();
                    
                    if (dados.nomeIgreja !== undefined) {
                        inputIgreja.value = dados.nomeIgreja;
                        subIgrejaDisplay.textContent = dados.nomeIgreja ? ' - ' + dados.nomeIgreja : '';
                    }

                    if (dados.linhas && Array.isArray(dados.linhas)) {
                        const linhas = document.querySelectorAll('#tabela-corpo tr');
                        dados.linhas.forEach((item, index) => {
                            if (linhas[index]) {
                                const cels = linhas[index].querySelectorAll('td');
                                if (cels[0] && cels[0].textContent !== item.num) cels[0].textContent = item.num || '';
                                if (cels[1] && cels[1].textContent !== item.nome) cels[1].textContent = item.nome || '';
                            }
                        });
                    }
                }
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-container')) {
                    document.getElementById('sugestoes-lista').style.display = 'none';
                }
            });
        };

        function parseCiasLine(line) {
            let raw = line.trim();
            if (!raw) return null;

            let numPart = '';
            let nomePart = '';

            const idx = raw.indexOf(' - ');
            if (idx !== -1) {
                numPart = raw.substring(0, idx).trim();
                nomePart = raw.substring(idx + 3).trim();
            } else {
                numPart = raw;
                nomePart = '';
            }

            let onlyNum = numPart.replace(/^(\(?CIAS\)?\s*)+/i, '').trim();

            if (idx === -1) {
                let rest = raw.replace(/^(\(?CIAS\)?\s*)+/i, '').trim();
                let matchNum = rest.match(/^(\d+)\s*(.*)/);
                if (matchNum) {
                    onlyNum = matchNum[1];
                    nomePart = matchNum[2].trim();
                } else {
                    onlyNum = '';
                    nomePart = rest;
                }
            }

            nomePart = nomePart.replace(/^(\(?CIAS\)?\s*)+/i, '').trim();

            let numDisplay = onlyNum ? `(CIAS) ${onlyNum}` : '(CIAS)';

            return {
                numDisplay: numDisplay,
                nomeDisplay: nomePart,
                searchText: nomePart ? `${numDisplay} - ${nomePart}` : numDisplay
            };
        }

        function parseAvulsoLine(line) {
            let raw = line.trim();
            if (!raw) return null;

            let numPart = '';
            let nomePart = '';

            const idx = raw.indexOf(' - ');
            if (idx !== -1) {
                numPart = raw.substring(0, idx).trim();
                nomePart = raw.substring(idx + 3).trim();
            } else {
                numPart = raw;
                nomePart = '';
            }

            let onlyNum = numPart.replace(/^AVULSO[S]?\s*/i, '').trim();

            if (idx === -1) {
                let rest = raw.replace(/^AVULSO[S]?\s*/i, '').trim();
                let matchNum = rest.match(/^(\d+)\s*(.*)/);
                if (matchNum) {
                    onlyNum = matchNum[1];
                    nomePart = matchNum[2].trim();
                } else {
                    onlyNum = '';
                    nomePart = rest;
                }
            }

            nomePart = nomePart.replace(/^AVULSO[S]?\s*/i, '').trim();

            let numDisplay = onlyNum ? `AVULSO ${onlyNum}` : 'AVULSO';

            return {
                numDisplay: numDisplay,
                nomeDisplay: nomePart,
                searchText: nomePart ? `${numDisplay} - ${nomePart}` : numDisplay
            };
        }

        function processarHinosParaBusca(coletaneaList, ciasList, avulsosList) {
            hinosArray = [];

            // 1. Coletânea
            coletaneaList.forEach(line => {
                const idx = line.indexOf(' - ');
                let num = line;
                let nome = '';
                if (idx !== -1) {
                    num = line.substring(0, idx).trim();
                    nome = line.substring(idx + 3).trim();
                } else {
                    num = line.trim();
                    nome = '';
                }
                hinosArray.push({
                    numDisplay: num,
                    nomeDisplay: nome,
                    searchText: nome ? `${num} - ${nome}` : num,
                    categoria: 'coletanea'
                });
            });

            // 2. CIAS
            ciasList.forEach(line => {
                const parsed = parseCiasLine(line);
                if (parsed) {
                    hinosArray.push({
                        numDisplay: parsed.numDisplay,
                        nomeDisplay: parsed.nomeDisplay,
                        searchText: parsed.searchText,
                        categoria: 'cias'
                    });
                }
            });

            // 3. Avulsos
            avulsosList.forEach(line => {
                const parsed = parseAvulsoLine(line);
                if (parsed) {
                    hinosArray.push({
                        numDisplay: parsed.numDisplay,
                        nomeDisplay: parsed.nomeDisplay,
                        searchText: parsed.searchText,
                        categoria: 'avulsos'
                    });
                }
            });
        }

        // --- FUNÇÕES EXPOSTAS PARA O WINDOW ---
        
        window.alternarAba = function(aba) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            let btnIndex = 0;
            if (aba === 'gerador') btnIndex = 0;
            if (aba === 'cifras') { btnIndex = 1; renderizarCifras(); }
            if (aba === 'gerenciar') btnIndex = 2;
            if (aba === 'banco-cifras') btnIndex = 3;

            document.getElementById('tab-' + aba).classList.add('active');
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
        };

        window.salvarBancoCifrasNuvem = async function() {
            const btn = document.querySelector('#tab-banco-cifras .btn-nuvem');
            btn.textContent = "Salvando...";
            const conteudo = document.getElementById('textarea-banco-cifras').value;
            
            try {
                await setDoc(doc(db, "configuracoes", "textosCifras"), {
                    conteudo: conteudo,
                    atualizadoEm: new Date().toISOString()
                });
                alert("Banco de Cifras atualizado na nuvem com sucesso!");
                textoBancoCifras = conteudo;
            } catch (error) {
                console.error("Erro ao salvar banco de cifras:", error);
                alert("Erro ao salvar o banco de cifras.");
            } finally {
                btn.textContent = "☁️ Salvar Cifras na Nuvem";
            }
        };

        window.salvarHinosNuvem = async function() {
            const btn = document.querySelector('#tab-gerenciar .btn-nuvem');
            btn.textContent = "Salvando...";

            const txtColetanea = document.getElementById('textarea-coletanea').value;
            const txtCias = document.getElementById('textarea-cias').value;
            const txtAvulsos = document.getElementById('textarea-avulsos').value;

            const arrayColetanea = txtColetanea.split('\n').map(h => h.trim()).filter(h => h.length > 0);
            const arrayCias = txtCias.split('\n').map(h => h.trim()).filter(h => h.length > 0);
            const arrayAvulsos = txtAvulsos.split('\n').map(h => h.trim()).filter(h => h.length > 0);
            
            try {
                await setDoc(doc(db, "configuracoes", "listaHinos"), {
                    coletanea: arrayColetanea,
                    cias: arrayCias,
                    avulsos: arrayAvulsos
                });
                alert("Lista de hinos atualizada na nuvem com sucesso!");
            } catch (error) {
                console.error("Erro ao salvar hinos:", error);
                alert("Erro ao salvar a lista no banco de dados.");
            } finally {
                btn.textContent = "☁️ Salvar no Banco de Dados";
            }
        };

        async function salvarNoFirestore() {
            salvandoRemotamente = true;
            try {
                const inputIgreja = document.getElementById('nome-igreja-input').value;
                const linhas = document.querySelectorAll('#tabela-corpo tr');
                const dadosLinhas = [];

                linhas.forEach(linha => {
                    const cels = linha.querySelectorAll('td');
                    dadosLinhas.push({
                        num: cels[0].textContent.trim(),
                        nome: cels[1].textContent.trim()
                    });
                });

                await setDoc(doc(db, "configuracoes", "listaAtual"), {
                    nomeIgreja: inputIgreja,
                    linhas: dadosLinhas,
                    atualizadoEm: new Date().toISOString()
                });
            } catch (error) {
                console.error("Erro ao salvar no Firestore: ", error);
            } finally {
                setTimeout(() => { salvandoRemotamente = false; }, 500);
            }
        }

        function atualizarSugestoes() {
            const input = document.getElementById('busca-hino');
            const termo = input.value.trim().toLowerCase();
            const listaDiv = document.getElementById('sugestoes-lista');
            
            listaDiv.innerHTML = '';

            if (!termo) {
                listaDiv.style.display = 'none';
                return;
            }

            let filtrados = hinosArray.filter(item => item.searchText.toLowerCase().includes(termo));

            if (/^\d+$/.test(termo)) {
                let exato = null;
                let outros = [];

                filtrados.forEach(item => {
                    const match = item.searchText.match(/^(\d+)/);
                    if (match && match[1] === termo) {
                        exato = item;
                    } else {
                        outros.push(item);
                    }
                });

                outros.sort((a, b) => {
                    const numA = parseInt(a.searchText.match(/^(\d+)/)?.[1] || 0);
                    const numB = parseInt(b.searchText.match(/^(\d+)/)?.[1] || 0);
                    return numB - numA;
                });

                filtrados = [];
                if (exato) filtrados.push(exato);
                filtrados = filtrados.concat(outros);
            } else {
                filtrados.sort((a, b) => a.searchText.localeCompare(b.searchText));
            }

            if (filtrados.length === 0) {
                listaDiv.style.display = 'none';
                return;
            }

            filtrados.forEach(itemObj => {
                const item = document.createElement('div');
                item.className = 'sugestao-item';
                item.textContent = itemObj.searchText;
                item.onclick = function() {
                    input.value = itemObj.searchText;
                    listaDiv.style.display = 'none';
                };
                listaDiv.appendChild(item);
            });

            listaDiv.style.display = 'block';
        }

        window.adicionarHino = function() {
            const input = document.getElementById('busca-hino');
            const valor = input.value.trim();
            document.getElementById('sugestoes-lista').style.display = 'none';
            
            if (!valor) return;

            let numero = '';
            let nome = '';

            const encontrado = hinosArray.find(item => item.searchText.toLowerCase() === valor.toLowerCase());

            if (encontrado) {
                numero = encontrado.numDisplay;
                nome = encontrado.nomeDisplay;
            } else {
                const valorUpper = valor.toUpperCase();
                if (valorUpper.includes('CIAS')) {
                    const parsed = parseCiasLine(valor);
                    if (parsed) {
                        numero = parsed.numDisplay;
                        nome = parsed.nomeDisplay;
                    }
                } else if (valorUpper.startsWith('AVULSO')) {
                    const parsed = parseAvulsoLine(valor);
                    if (parsed) {
                        numero = parsed.numDisplay;
                        nome = parsed.nomeDisplay;
                    }
                } else {
                    const indexHifen = valor.indexOf(' - ');
                    if (indexHifen !== -1) {
                        numero = valor.substring(0, indexHifen).trim();
                        nome = valor.substring(indexHifen + 3).trim();
                    } else {
                        numero = valor;
                        nome = '';
                    }
                }
            }

            const linhas = document.querySelectorAll('#tabela-corpo tr');
            let adicionou = false;

            for (let linha of linhas) {
                const celulas = linha.querySelectorAll('td');
                if (celulas[0].textContent.trim() === '' && celulas[1].textContent.trim() === '') {
                    celulas[0].textContent = numero;
                    celulas[1].textContent = nome;
                    adicionou = true;
                    break;
                }
            }

            if (!adicionou) {
                alert("A lista está cheia! Limpe-a ou apague um item antes de adicionar outro.");
            } else {
                input.value = '';
                salvarNoFirestore();
            }
        };

        window.limparLista = function() {
            const celulas = document.querySelectorAll('td[contenteditable="true"]');
            celulas.forEach(celula => celula.textContent = '');
            salvarNoFirestore();
            document.getElementById('container-cifras').innerHTML = '<p style="text-align: center; color: #666;">As cifras dos louvores selecionados na lista aparecerão aqui.</p>';
        };

        // Função principal para extrair e renderizar as cifras baseadas na lista atual
        window.renderizarCifras = function() {
            const container = document.getElementById('container-cifras');
            container.innerHTML = ''; // Limpa o container
            
            if (!textoBancoCifras || textoBancoCifras.trim() === '') {
                container.innerHTML = '<p style="text-align: center; color: #c8102e; font-weight: bold;">O Banco de Cifras está vazio. Cole o texto do PDF na aba "Banco de Cifras".</p>';
                return;
            }

            const linhas = document.querySelectorAll('#tabela-corpo tr');
            let encontrouAlguma = false;

            linhas.forEach(linha => {
                const cels = linha.querySelectorAll('td');
                let numRaw = cels[0].textContent.trim();
                let nomeRaw = cels[1].textContent.trim();

                if (numRaw !== '') {
                    // Limpa formatações extras de CIAS/AVULSO para focar só no número, se for o caso
                    // O PDF normalmente traz o número cru (ex: "3 - CLAMO A TI" ou "4- QUANDO")
                    let numLimpo = numRaw.replace(/\D/g, ''); 
                    
                    if (numLimpo) {
                        let cifraExtraida = extrairBlocoCifra(numLimpo, textoBancoCifras);
                        
                        if (cifraExtraida) {
                            encontrouAlguma = true;
                            let block = document.createElement('div');
                            block.className = 'cifra-block';
                            
                            // Remove tags de source geradas pelo IA no dump, caso existam, para ficar mais limpo
                            let textoLimpo = cifraExtraida.replace(/\/g, '').trim();

                            block.innerHTML = `<strong>${numRaw} - ${nomeRaw}</strong>${textoLimpo}`;
                            container.appendChild(block);
                        }
                    }
                }
            });

            if (!encontrouAlguma) {
                container.innerHTML = '<p style="text-align: center; color: #666;">Nenhuma cifra correspondente aos números da lista foi encontrada no Banco de Cifras.</p>';
            }
        };

        // Função auxiliar que busca o bloco de texto de um hino específico
        function extrairBlocoCifra(numeroHino, textoCompleto) {
            // Regex para encontrar o início do hino: "1 - NOME", "1- NOME", "1 NOME"
            // Garante que o número esteja no início de uma linha
            const startRegex = new RegExp(`(?:^|\\n)\\s*${numeroHino}\\s*[-–]`, 'i');
            const matchStart = textoCompleto.match(startRegex);

            if (!matchStart) return null;

            const startIndex = matchStart.index;
            const restoDoTexto = textoCompleto.substring(startIndex + matchStart[0].length);
            
            // Regex para encontrar o início do PRÓXIMO hino para demarcar o fim da extração
            // Busca quebra de linha seguida de números e hífen
            const endRegex = /\n\s*\d+\s*[-–]\s*[A-Z]/;
            const matchEnd = restoDoTexto.match(endRegex);

            let textoExtraido = "";
            if (matchEnd) {
                textoExtraido = textoCompleto.substring(startIndex, startIndex + matchStart[0].length + matchEnd.index);
            } else {
                // Se não achar o próximo, pega até o fim do texto
                textoExtraido = textoCompleto.substring(startIndex);
            }

            return textoExtraido;
        }

        window.salvarImagem = async function(e) {
            const elemento = document.getElementById('lista-louvores');
            const btn = e.currentTarget;
            const textoOriginal = btn.textContent;
            btn.textContent = "Baixando...";
            btn.disabled = true;

            try {
                const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: "#ffffff" });
                canvas.toBlob((blob) => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'lista_louvores.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, 'image/png');
            } catch (error) {
                console.error("Erro ao salvar imagem: ", error);
                alert("Houve um erro ao salvar a imagem.");
            } finally {
                btn.textContent = textoOriginal;
                btn.disabled = false;
            }
        };

        window.exportarECompartilhar = async function(e) {
            const elemento = document.getElementById('lista-louvores');
            const btn = e.currentTarget;
            const textoOriginal = btn.textContent;
            btn.textContent = "Gerando...";
            btn.disabled = true;

            try {
                const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: "#ffffff" });
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "lista_louvores.png", { type: "image/png" });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Lista de Louvores',
                                text: 'Segue a lista de louvores!'
                            });
                        } catch (error) {
                            console.log("Compartilhamento cancelado ou não suportado.");
                        }
                    } else {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'lista_louvores.png';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        alert("A imagem foi baixada para o seu dispositivo!");
                    }
                }, 'image/png');
            } catch (error) {
                console.error("Erro ao gerar imagem: ", error);
                alert("Houve um erro ao gerar a imagem.");
            } finally {
                btn.textContent = textoOriginal;
                btn.disabled = false;
            }
        };
    </script>
