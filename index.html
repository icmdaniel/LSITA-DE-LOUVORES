    <style>
        :root {
            --primary: #c8102e;
            --secondary: #27ae60;
            --info: #2980b9;
            --bg-color: #f4f7f6;
            --app-text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--app-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }

        /* Container de Pesquisa com Sugestões Personalizadas */
        .search-container {
            position: relative;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }

        .search-container input, .config-container input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            text-transform: uppercase; /* Deixa o input da igreja em maiúsculo também */
        }

        .search-container input:focus, .config-container input:focus {
            border-color: var(--primary);
        }

        .config-container {
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .config-container input {
            width: 100%;
        }

        /* Lista suspensa customizada para ordenação inteligente */
        #sugestoes-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 110px; /* Deixa espaço para o botão adicionar */
            background: white;
            border: 2px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sugestao-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 1px solid #eee;
        }

        .sugestao-item:hover {
            background-color: #f0f0f0;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-add {
            background-color: var(--info);
        }

        .btn-salvar {
            background-color: var(--secondary);
        }

        .btn-limpar {
            background-color: #666;
        }

        /* ÁREA QUE SERÁ TRANSFORMADA EM IMAGEM */
        .capture-wrapper {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow-x: auto;
            max-width: 100%;
        }

        #lista-louvores {
            width: 600px; /* Largura fixa para manter a proporção da imagem */
            background-color: #fff;
            border: 2px solid #000;
            font-family: Arial, sans-serif;
            margin: 0 auto;
        }

        /* Cabeçalho ICM */
        .header-icm {
            padding: 15px 20px;
            border-bottom: 2px solid #000;
            text-align: center;
        }

        .logo-icm {
            color: #bd1622;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-icm .serif {
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase; /* Garante que todo o texto do cabeçalho fique em maiúsculo */
        }

        /* Sub-cabeçalho (Louvores e Data) */
        .sub-header {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 2px solid #000;
        }

        .sub-header .data-text {
            text-decoration: underline;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid #000;
            padding: 12px 10px;
            font-size: 18px;
        }

        th {
            background-color: #e0e0e0;
            font-weight: bold;
        }

        th:first-child {
            width: 80px;
            text-align: center;
        }

        th:nth-child(2) {
            text-align: center;
        }

        td:first-child {
            text-align: center;
        }

        td:nth-child(2) {
            text-align: left;
            padding-left: 15px;
        }

        /* Células editáveis */
        td[contenteditable="true"] {
            outline: none;
            cursor: text;
            text-transform: uppercase; /* Deixa tudo em maiúsculo automaticamente */
        }
        
        td[contenteditable="true"]:empty:before {
            content: "\feff"; /* Garante altura mínima para linhas vazias */
            display: block;
        }

        td[contenteditable="true"]:hover {
            background-color: #f9f9f9;
        }

    </style>
</head>

            const inputBusca = document.getElementById('busca-hino');
            inputBusca.addEventListener('input', atualizarSugestoes);

            // Configura o evento para atualizar o nome da igreja em tempo real
            const inputIgreja = document.getElementById('nome-igreja-input');
            const subIgrejaDisplay = document.getElementById('sub-igreja-display');
            inputIgreja.addEventListener('input', function() {
                const valor = inputIgreja.value.trim();
                if (valor) {
                    subIgrejaDisplay.textContent = ' - ' + valor;
                } else {
                    subIgrejaDisplay.textContent = '';
                }
            });

            // Fecha as sugestões se clicar fora
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-container')) {
                    document.getElementById('sugestoes-lista').style.display = 'none';
                }
            });
        };

        // Função para atualizar as sugestões com ordem decrescente e exato no topo
        function atualizarSugestoes() {
            const input = document.getElementById('busca-hino');
            const termo = input.value.trim().toLowerCase();
            const listaDiv = document.getElementById('sugestoes-lista');
            
            listaDiv.innerHTML = '';

            if (!termo) {
                listaDiv.style.display = 'none';
                return;
            }

            // Filtra os hinos que correspondem ao termo digitado
            let filtrados = hinosArray.filter(hino => hino.toLowerCase().includes(termo));

            // Se o termo digitado for estritamente um número, aplica a regra de colocar o número exato no topo e o restante decrescente
            if (/^\d+$/.test(termo)) {
                let exato = null;
                let outros = [];

                filtrados.forEach(hino => {
                    // Extrai o número inicial do hino para comparação exata
                    const match = hino.match(/^(\d+)/);
                    if (match && match[1] === termo) {
                        exato = hino;
                    } else {
                        outros.push(hino);
                    }
                });

                // Ordena os outros em ordem decrescente baseada no número
                outros.sort((a, b) => {
                    const numA = parseInt(a.match(/^(\d+)/)?.[1] || 0);
                    const numB = parseInt(b.match(/^(\d+)/)?.[1] || 0);
                    return numB - numA;
                });

                filtrados = [];
                if (exato) filtrados.push(exato);
                filtrados = filtrados.concat(outros);
            } else {
                // Para textos gerais, mantém ordenação padrão ou alfabética/decrescente se preferir
                filtrados.sort((a, b) => b.localeCompare(a));
            }

            if (filtrados.length === 0) {
                listaDiv.style.display = 'none';
                return;
            }

            // Cria os elementos visuais da lista suspensa
            filtrados.forEach(hino => {
                const item = document.createElement('div');
                item.className = 'sugestao-item';
                item.textContent = hino;
                item.onclick = function() {
                    input.value = hino;
                    listaDiv.style.display = 'none';
                };
                listaDiv.appendChild(item);
            });

            listaDiv.style.display = 'block';
        }

        // 2. Adicionar Hino da Pesquisa para a Tabela
        function adicionarHino() {
            const input = document.getElementById('busca-hino');
            const valor = input.value.trim();
            document.getElementById('sugestoes-lista').style.display = 'none';
            
            if (!valor) return; // Se estiver vazio, não faz nada

            // Separa o Número do Nome (Ex: "622 - Nome do Hino" ou "(CIAS) 146 - Nome")
            const indexHifen = valor.indexOf(' - ');
            let numero = valor;
            let nome = '';

            if (indexHifen !== -1) {
                numero = valor.substring(0, indexHifen).trim();
                nome = valor.substring(indexHifen + 3).trim();
            }

            // Procura a primeira linha vazia na tabela
            const linhas = document.querySelectorAll('#tabela-corpo tr');
            let adicionou = false;

            for (let linha of linhas) {
                const celulas = linha.querySelectorAll('td');
                if (celulas[0].textContent.trim() === '' && celulas[1].textContent.trim() === '') {
                    celulas[0].textContent = numero;
                    celulas[1].textContent = nome;
                    adicionou = true;
                    break;
                }
            }

            if (!adicionou) {
                alert("A lista está cheia! Limpe-a ou apague um item antes de adicionar outro.");
            } else {
                input.value = ''; // Limpa a barra de pesquisa
            }
        }

        // 3. Limpar a tabela
        function limparLista() {
            const celulas = document.querySelectorAll('td[contenteditable="true"]');
            celulas.forEach(celula => celula.textContent = '');
        }

        // 4. Salvar Imagem
        async function salvarImagem(e) {
            const elemento = document.getElementById('lista-louvores');
            const btn = e.currentTarget;
            const textoOriginal = btn.textContent;
            btn.textContent = "Baixando...";
            btn.disabled = true;

            try {
                const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: "#ffffff" });
                canvas.toBlob((blob) => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'lista_louvores.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, 'image/png');
            } catch (error) {
                console.error("Erro ao salvar imagem: ", error);
                alert("Houve um erro ao salvar a imagem.");
            } finally {
                btn.textContent = textoOriginal;
                btn.disabled = false;
            }
        }

        // 5. Compartilhar
        async function exportarECompartilhar(e) {
            const elemento = document.getElementById('lista-louvores');
            const btn = e.currentTarget;
            const textoOriginal = btn.textContent;
            btn.textContent = "Gerando...";
            btn.disabled = true;

            try {
                const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: "#ffffff" });
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "lista_louvores.png", { type: "image/png" });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Lista de Louvores',
                                text: 'Segue a lista de louvores!'
                            });
                        } catch (error) {
                            console.log("Compartilhamento cancelado ou não suportado.");
                        }
                    } else {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'lista_louvores.png';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        alert("A imagem foi baixada para o seu dispositivo!");
                    }
                }, 'image/png');
            } catch (error) {
                console.error("Erro ao gerar imagem: ", error);
                alert("Houve um erro ao gerar a imagem.");
            } finally {
                btn.textContent = textoOriginal;
                btn.disabled = false;
            }
        }
    </script>
